version: '3.8'

services:
  # 1. PostgreSQL 16 with PostGIS Spatial Extension
  db:
    image: postgis/postgis:16-3.4
    container_name: wifisense-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wifisense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wifisense_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-wifisense_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - wifisense-net

  # 2. Redis Telemetry Cache & Pub/Sub
  redis:
    image: redis:7-alpine
    container_name: wifisense-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - wifisense-net

  # 3. Keycloak Identity & Access Management (OIDC / OAuth2)
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: wifisense-keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_password_123
    ports:
      - "8080:8080"
    networks:
      - wifisense-net

  # 4. FastAPI Backend Application
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wifisense-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://wifisense:wifisense_secure_pass@db:5432/wifisense_db
      - REDIS_URL=redis://redis:6379/0
      - KEYCLOAK_URL=http://keycloak:8080
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    networks:
      - wifisense-net

  # 5. React 18 / Three.js 3D Digital Twin Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wifisense-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - wifisense-net

volumes:
  pgdata:

networks:
  wifisense-net:
    driver: bridge

